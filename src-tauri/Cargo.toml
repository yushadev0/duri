[package]
name = "duri"
version = "0.1.0"
description = "A dynamic island for Windows"
authors = ["yushadev0"]
license = "MIT"
repository = "https://github.com/yushadev0/duri"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "duri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
base64 = "0.23.1"
log = "0.4.35"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
tauri-plugin-opener = "2.7.2"
tiny_http = "0.12.0"
clipboard-win = { version = "5.4.3", features = ["monitor"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

